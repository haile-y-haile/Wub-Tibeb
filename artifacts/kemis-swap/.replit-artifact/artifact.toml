kind = "web"
previewPath = "/"
title = "Wub Tibeb · ውብ ጥበብ"
description = "Wub Tibeb — ውብ ጥበብ. Wear. Share. Repeat. An Ethiopia-first Habesha kemis exchange community with reciprocal garment matching, private messaging and bilateral swap confirmation."
version = "1.0.0"
id = "artifacts/kemis-swap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25077

[services.development]
run = "pnpm --filter @workspace/kemis-swap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kemis-swap", "run", "build" ]
serve = "static"
publicDir = "artifacts/kemis-swap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25077"
BASE_PATH = "/"
