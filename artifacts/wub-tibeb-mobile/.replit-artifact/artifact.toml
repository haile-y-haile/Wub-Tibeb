kind = "mobile"
previewPath = "/wub-tibeb-mobile/"
title = "Wub Tibeb · iOS & Android"
description = "A dedicated Wub Tibeb app for iPhone and Android. Browse Habesha kemis, list garments, make reciprocal garment-specific matches, message swap partners, and confirm exchanges using the same account and listings as the website."
version = "1.0.0"
id = "artifacts/wub-tibeb-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/wub-tibeb-mobile/" ]
localPort = 20985

[services.development]
run = "pnpm --filter @workspace/wub-tibeb-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wub-tibeb-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wub-tibeb-mobile", "run", "serve" ]

[services.env]
PORT = "20985"
BASE_PATH = "/wub-tibeb-mobile/"
