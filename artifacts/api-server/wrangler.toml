name = "wub-tibeb-staging"
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../kemis-swap/dist/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "staging"

[[hyperdrive]]
binding = "HYPERDRIVE"
# Replace only with the ID of a newly created staging Hyperdrive config.
id = "00000000000000000000000000000000"
localConnectionString = "postgres://postgres:postgres@127.0.0.1:5432/wubtibeb_staging"

[[r2_buckets]]
binding = "PRIVATE_IMAGES"
# Create a dedicated staging bucket before deployment. Never point this at production photos.
bucket_name = "wub-tibeb-staging-private-images"
