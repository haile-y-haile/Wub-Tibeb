openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Private profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      operationId: saveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /listings:
    get:
      operationId: getListings
      parameters:
        - { name: before, in: query, schema: { type: string, maxLength: 160 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: occasion, in: query, schema: { type: string } }
        - { name: color, in: query, schema: { type: string } }
        - { name: condition, in: query, schema: { type: string } }
        - { name: neighborhood, in: query, schema: { type: string } }
        - { name: fabric, in: query, schema: { type: string } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: compatible, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Dresses
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Listing" } }
    post:
      operationId: createListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
  /listings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getListing
      responses:
        "200":
          description: Dress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
    put:
      operationId: updateListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
    delete:
      operationId: deleteListing
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /swipes:
    post:
      operationId: swipeDress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwipeInput" }
      responses:
        "200":
          description: Swipe recorded
          content:
            application/json:
              schema:
                type: object
                required: [matched]
                properties:
                  matched: { type: boolean }
                  matchId: { type: string }
  /matches:
    get:
      operationId: getMatches
      parameters:
        - { name: before, in: query, schema: { type: string, maxLength: 160 } }
        - { name: id, in: query, schema: { type: string, maxLength: 160 } }
      responses:
        "200":
          description: Matches including history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Match" } }
  /matches/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getMessages
      parameters:
        - { name: before, in: query, schema: { type: string, maxLength: 160 } }
      responses:
        "200":
          description: Private messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Message" } }
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /matches/{id}/exchange:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: updateExchange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExchangeInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
  /reports:
    post:
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Reported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /blocks:
    post:
      operationId: blockUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockInput" }
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /notifications:
    get:
      operationId: getNotifications
      parameters:
        - { name: before, in: query, schema: { type: string, maxLength: 160 } }
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Notification" } }
    post:
      operationId: readNotifications
      responses:
        "200":
          description: Read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /community:
    get:
      operationId: getCommunity
      responses:
        "200":
          description: Live counts
          content:
            application/json:
              schema:
                type: object
                required: [dresses, swaps, neighborhoods]
                properties:
                  dresses: { type: integer }
                  swaps: { type: integer }
                  neighborhoods: { type: integer }
  /moderation:
    get:
      operationId: getModeration
      parameters:
        - { name: before, in: query, schema: { type: string, maxLength: 160 } }
      responses:
        "200":
          description: Admin reports
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Report" } }
    post:
      operationId: moderateReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationInput" }
      responses:
        "200":
          description: Moderated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /storage/public-objects/tutorials/{filename}:
    get:
      operationId: getTutorialAsset
      description: Public curated first-time-user tutorial video, poster or caption track. Supports HEAD and single byte ranges. Never exposes member uploads.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^(listing|matching|exchange)-(am|en)\.(mp4|webp|vtt)$'
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Full public tutorial asset
          content:
            video/mp4:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            text/vtt:
              schema: { type: string }
        "206":
          description: Requested byte range
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Unknown or unavailable tutorial asset
        "416":
          description: Unsupported or unsatisfiable range
  /storage/uploads/request-url:
    post:
      operationId: requestUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Signed upload
          content:
            application/json:
              schema:
                type: object
                required: [uploadURL, objectPath]
                properties:
                  uploadURL: { type: string }
                  objectPath: { type: string }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Success:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    Measurements:
      type: object
      required: [bust, waist, hips, shoulder, length, sleeves]
      properties:
        bust: { type: number, minimum: 20, maximum: 250 }
        waist: { type: number, minimum: 20, maximum: 250 }
        hips: { type: number, minimum: 20, maximum: 250 }
        shoulder: { type: number, minimum: 10, maximum: 100 }
        length: { type: number, minimum: 30, maximum: 250 }
        sleeves: { type: number, minimum: 0, maximum: 120 }
    ProfileInput:
      type: object
      required: [name, neighborhood, language]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        neighborhood: { type: string, minLength: 1, maxLength: 80 }
        language: { type: string, enum: [en, am] }
        measurements: { $ref: "#/components/schemas/Measurements" }
    Profile:
      allOf:
        - { $ref: "#/components/schemas/ProfileInput" }
        - type: object
          required: [id, role]
          properties:
            id: { type: string }
            role: { type: string }
    ListingInput:
      type: object
      required: [title, description, photos, condition, color, fabric, embroidery, occasion, timesWorn, measurements]
      properties:
        title: { type: string, minLength: 3, maxLength: 100 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        photos: { type: array, minItems: 1, maxItems: 6, items: { type: string } }
        condition: { type: string, enum: [Like new, Excellent, Good, Fair] }
        color: { type: string, minLength: 1, maxLength: 40 }
        fabric: { type: string, minLength: 1, maxLength: 60 }
        embroidery: { type: string, minLength: 1, maxLength: 120 }
        occasion: { type: string, enum: [Timket, Meskel, Enkutatash, Fasika, Genna, Wedding, Other holiday] }
        timesWorn: { type: integer, minimum: 0, maximum: 1000 }
        measurements: { $ref: "#/components/schemas/Measurements" }
    Listing:
      allOf:
        - { $ref: "#/components/schemas/ListingInput" }
        - type: object
          required: [id, ownerId, ownerName, neighborhood, status, demo, createdAt]
          properties:
            id: { type: string }
            ownerId: { type: string }
            ownerName: { type: string }
            neighborhood: { type: string }
            status: { type: string }
            demo: { type: boolean }
            createdAt: { type: string }
            compatible: { type: boolean }
    SwipeInput:
      type: object
      required: [targetId, direction]
      properties:
        targetId: { type: string }
        offeredId: { type: string }
        direction: { type: string, enum: [like, pass] }
    Match:
      type: object
      required: [id, dressA, dressB, userA, userB, status, acceptedBy, completedBy, proposal, createdAt]
      properties:
        id: { type: string }
        dressA: { $ref: "#/components/schemas/Listing" }
        dressB: { $ref: "#/components/schemas/Listing" }
        userA: { type: string }
        userB: { type: string }
        status: { type: string }
        acceptedBy: { type: array, items: { type: string } }
        completedBy: { type: array, items: { type: string } }
        proposal: { type: string }
        createdAt: { type: string }
    MessageInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
    Message:
      type: object
      required: [id, senderId, text, createdAt]
      properties:
        id: { type: string }
        senderId: { type: string }
        text: { type: string }
        createdAt: { type: string }
    ExchangeInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [propose, accept, complete, cancel] }
        proposal: { type: string, maxLength: 500 }
        expectedProposal:
          type: string
          maxLength: 500
          description: Required when accepting; must exactly match the proposal the member reviewed.
    ReportInput:
      type: object
      required: [listingId, reason]
      properties:
        listingId: { type: string }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    BlockInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    Notification:
      type: object
      required: [id, text, read, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        read: { type: boolean }
        createdAt: { type: string }
    Report:
      type: object
      required: [id, listingId, reason, status]
      properties:
        id: { type: string }
        listingId: { type: string }
        reason: { type: string }
        status: { type: string }
        handoffHold: { type: boolean }
    ModerationInput:
      type: object
      required: [reportId, action]
      properties:
        reportId: { type: string }
        action: { type: string, enum: [dismiss, hide, close_dispute] }
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, maxLength: 200 }
        size: { type: integer, minimum: 1, maximum: 2097152 }
        contentType: { type: string, enum: [image/jpeg, image/webp, image/png] }
